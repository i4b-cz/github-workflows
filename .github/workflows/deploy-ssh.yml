name: Deploy via SSH

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment (staging/production)'
        type: string
        required: true
      node-version:
        description: 'Node.js version for frontend build'
        type: string
        default: '20'
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA). Defaults to the triggering ref.'
        type: string
        required: false
        default: ''
      deploy-config:
        description: 'JSON configuration for deployment'
        type: string
        required: true
        # Expected structure:
        # {
        #   "backend": { "enabled": true, "path": "./backend", "rsync-exclude": [...], "public-includes": ["index.php", ".htaccess", "cron/"] },
        #   "frontend": { "enabled": true, "path": "./frontend", "build-command": "npm run build", "post-build-commands": [...], "deploy-to": "backend/public/", "rsync-exclude": [...] },
        #   -- OR (multi-frontend) --
        #   "frontends": [
        #     { "name": "public", "path": "./frontend", "build-command": "npm run build", "post-build-commands": [...], "deploy-to": "backend/public/", "rsync-exclude": [...] },
        #     { "name": "admin", "path": "./frontend-admin", "build-command": "npm run build", "deploy-to": "backend/public/admin/", "rsync-exclude": [] }
        #   ],
        #   Note: "name" must be a non-empty alphanumeric string. The name "default" is reserved
        #   for legacy mode — a frontend named "default" receives only common ENV_* vars and
        #   cannot have its own prefix. Avoid using "default" in multi-frontend configs.
        #   To disable a frontend in multi-frontend mode, remove it from the array.
        #
        #   "backup": { "enabled": false, "database": true, "commit-hash": true },
        #   "health-check": { "enabled": true, "url": "/api/config", "verify-production-mode": false },
        #   "post-deploy": { "composer-install": true, "run-migrations": true, "clear-cache": true, "restart-workers": false, "custom-commands": [] }
        # }
        #
        # Multi-frontend .env convention:
        #   ENV_*        → all frontends (common)
        #   ENV_ADMIN_*  → only frontend with name "admin" (prefix stripped, e.g. ENV_ADMIN_VITE_FOO → VITE_FOO)
        #   ENV_PUBLIC_* → only frontend with name "public"
        #   Prefixed vars override common vars with the same key (deduplication applied).
        #   Note: Backend .env.local receives ALL ENV_* vars unfiltered (prefix scoping is frontend-only).
        #
        # Note: .env files are auto-generated from GitHub Secrets/Variables with ENV_ prefix.

    secrets:
      SSH_KEY:
        description: 'SSH private key for deployment'
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Parse deploy config
        id: config
        env:
          DEPLOY_CONFIG: ${{ inputs.deploy-config }}
        run: |
          # Use env var to avoid shell injection from JSON content
          CONFIG="$DEPLOY_CONFIG"

          # Backend config
          echo "backend-enabled=$(echo "$CONFIG" | jq -r '.backend.enabled != false')" >> $GITHUB_OUTPUT
          echo "backend-path=$(echo "$CONFIG" | jq -r '.backend.path // "./backend"')" >> $GITHUB_OUTPUT

          # Normalize frontend config: "frontends" array or legacy "frontend" object → /tmp/frontends.json
          HAS_FRONTENDS=$(echo "$CONFIG" | jq 'has("frontends")')
          HAS_FRONTEND=$(echo "$CONFIG" | jq 'has("frontend")')

          if [ "$HAS_FRONTENDS" == "true" ]; then
            # Multi-frontend mode — filter out disabled entries
            echo "$CONFIG" | jq '[.frontends[] | select(.enabled != false)]' > /tmp/frontends.json
          elif [ "$HAS_FRONTEND" == "true" ]; then
            # Legacy single-frontend mode — wrap in array
            ENABLED=$(echo "$CONFIG" | jq -r '.frontend.enabled != false')
            if [ "$ENABLED" == "true" ]; then
              echo "$CONFIG" | jq '[.frontend + {"name": (.frontend.name // "default")}]' > /tmp/frontends.json
            else
              echo '[]' > /tmp/frontends.json
            fi
          else
            # No frontend config at all — default to single frontend at ./frontend (backward compat)
            echo '[{"name":"default","path":"./frontend","build-command":"npm run build","deploy-to":"backend/public/","rsync-exclude":[]}]' > /tmp/frontends.json
          fi

          # Validate frontends.json is a JSON array with required fields
          if ! jq -e 'type == "array"' /tmp/frontends.json > /dev/null 2>&1; then
            echo "::error::frontends.json is not a valid JSON array"
            cat /tmp/frontends.json
            exit 1
          fi
          INVALID=$(jq '[.[] | select(.path == null or .path == "")] | length' /tmp/frontends.json)
          if [ "$INVALID" -gt 0 ]; then
            echo "::error::$INVALID frontend entries are missing the required 'path' field"
            exit 1
          fi

          FRONTEND_COUNT=$(jq 'length' /tmp/frontends.json)
          echo "frontend-count=$FRONTEND_COUNT" >> $GITHUB_OUTPUT
          echo "frontends-enabled=$([ "$FRONTEND_COUNT" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

          # Emit legacy output names for backward compatibility (single-frontend only)
          if [ "$FRONTEND_COUNT" -eq 1 ]; then
            echo "frontend-enabled=true" >> $GITHUB_OUTPUT
            echo "frontend-path=$(jq -r '.[0].path' /tmp/frontends.json)" >> $GITHUB_OUTPUT
            echo "frontend-build-command=$(jq -r '.[0]["build-command"] // "npm run build"' /tmp/frontends.json)" >> $GITHUB_OUTPUT
            echo "frontend-deploy-to=$(jq -r '.[0]["deploy-to"] // "backend/public/"' /tmp/frontends.json)" >> $GITHUB_OUTPUT
          elif [ "$FRONTEND_COUNT" -eq 0 ]; then
            echo "frontend-enabled=false" >> $GITHUB_OUTPUT
          fi

          # Generate cache-dependency-path (newline-separated list of package-lock.json paths)
          while read -r fpath; do
            if [ -n "$fpath" ]; then
              echo "$fpath/package-lock.json"
            fi
          done < <(jq -r '.[].path // empty' /tmp/frontends.json) > /tmp/cache-paths.txt
          # Store as multi-line GitHub output using heredoc delimiter
          CACHE_PATHS=$(paste -sd $'\n' /tmp/cache-paths.txt)
          {
            echo "cache-dependency-paths<<CACHE_EOF"
            echo "$CACHE_PATHS"
            echo "CACHE_EOF"
          } >> $GITHUB_OUTPUT

          # Backup config
          echo "backup-enabled=$(echo "$CONFIG" | jq -r '.backup.enabled // false')" >> $GITHUB_OUTPUT
          echo "backup-database=$(echo "$CONFIG" | jq -r '.backup.database != false')" >> $GITHUB_OUTPUT

          # Health check config
          echo "healthcheck-enabled=$(echo "$CONFIG" | jq -r '.["health-check"].enabled != false')" >> $GITHUB_OUTPUT
          echo "healthcheck-url=$(echo "$CONFIG" | jq -r '.["health-check"].url // "/api/config"')" >> $GITHUB_OUTPUT
          echo "healthcheck-verify-production=$(echo "$CONFIG" | jq -r '.["health-check"]["verify-production-mode"] // false')" >> $GITHUB_OUTPUT

          # Post-deploy config
          echo "postdeploy-composer=$(echo "$CONFIG" | jq -r '.["post-deploy"]["composer-install"] != false')" >> $GITHUB_OUTPUT
          echo "postdeploy-migrations=$(echo "$CONFIG" | jq -r '.["post-deploy"]["run-migrations"] != false')" >> $GITHUB_OUTPUT
          echo "postdeploy-cache=$(echo "$CONFIG" | jq -r '.["post-deploy"]["clear-cache"] != false')" >> $GITHUB_OUTPUT
          echo "postdeploy-workers=$(echo "$CONFIG" | jq -r '.["post-deploy"]["restart-workers"] // false')" >> $GITHUB_OUTPUT

          # Build list of known frontend env prefixes (e.g. "ADMIN", "PUBLIC") for env var filtering
          jq -r '.[].name // empty' /tmp/frontends.json | tr '[:lower:]' '[:upper:]' | (grep -v -e '^DEFAULT$' -e '^$' || true) | sort -u > /tmp/frontend-prefixes.txt
          echo "  Frontend env prefixes: $(paste -sd, /tmp/frontend-prefixes.txt || echo '(none)')"

          # Store rsync excludes and other config lists as files for later use
          echo "$CONFIG" | jq -r '.backend["rsync-exclude"] // [".git", "node_modules", "vendor", "var/cache", "var/log", "var/pdf", "public/"] | .[]' > /tmp/rsync-excludes.txt
          echo "$CONFIG" | jq -r '.backend["public-includes"] // ["index.php"] | .[]' > /tmp/public-includes.txt
          echo "$CONFIG" | jq -r '.["post-deploy"]["custom-commands"] // [] | .[]' > /tmp/custom-commands.txt

          echo "✓ Parsed config: backend=$(echo "$CONFIG" | jq -r '.backend.enabled != false'), frontends=$FRONTEND_COUNT"

      - name: Generate .env files from ENV_ prefixed variables
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          VARS_CONTEXT: ${{ toJSON(vars) }}
          BACKEND_PATH: ${{ steps.config.outputs.backend-path }}
          BACKEND_ENABLED: ${{ steps.config.outputs.backend-enabled }}
          FRONTENDS_ENABLED: ${{ steps.config.outputs.frontends-enabled }}
        run: |
          # Build jq exclusion pattern from known frontend prefixes
          # e.g. if prefixes are ADMIN,PUBLIC → pattern is "^ENV_(ADMIN|PUBLIC)_"
          EXCLUDE_PATTERN=""
          if [ -s /tmp/frontend-prefixes.txt ]; then
            PREFIXES_RE=$(paste -sd'|' /tmp/frontend-prefixes.txt)
            EXCLUDE_PATTERN="^ENV_(${PREFIXES_RE})_"
          fi

          # Function to extract ALL ENV_* variables (for backend — no prefix filtering)
          extract_all_env_vars() {
            local json="$1"
            echo "$json" | jq -r '
              to_entries[]
              | select(.key | startswith("ENV_"))
              | "\(.key | sub("^ENV_"; ""))=\(.value)"
            '
          }

          # Function to extract common ENV_* variables (excluding per-frontend prefixed vars)
          extract_common_env_vars() {
            local json="$1"
            if [ -n "$EXCLUDE_PATTERN" ]; then
              echo "$json" | jq -r --arg pattern "$EXCLUDE_PATTERN" '
                to_entries[]
                | select(.key | startswith("ENV_"))
                | select(.key | test($pattern) | not)
                | "\(.key | sub("^ENV_"; ""))=\(.value)"
              '
            else
              # No frontend prefixes defined — all ENV_* are common
              extract_all_env_vars "$json"
            fi
          }

          # Generate backend .env.local (receives ALL ENV_* vars, no prefix filtering)
          if [ "$BACKEND_ENABLED" == "true" ]; then
            echo "→ Generating backend .env.local..."
            {
              extract_all_env_vars "$VARS_CONTEXT"
              extract_all_env_vars "$SECRETS_CONTEXT"
            } > "$BACKEND_PATH/.env.local"

            # Inject the deployed git SHA as SENTRY_RELEASE so Sentry can tag
            # each event with the exact build (first-seen-in-release, regression
            # detection, suspect commits). Harmless for projects that don't use
            # Sentry — it's just an unused env var. Appended last so it wins over
            # any static ENV_SENTRY_RELEASE value.
            echo "SENTRY_RELEASE=${GITHUB_SHA}" >> "$BACKEND_PATH/.env.local"

            VAR_COUNT=$(wc -l < "$BACKEND_PATH/.env.local" | tr -d ' ')
            echo "✓ Generated $BACKEND_PATH/.env.local with $VAR_COUNT variables"
          fi

          # Generate frontend .env.local files
          # Using .env.local because it has highest priority in Vite regardless of --mode
          # (Vite loads .env.local before .env.{mode}, and .env.local is never overridden)
          if [ "$FRONTENDS_ENABLED" == "true" ]; then
            while read -r frontend; do
              FPATH=$(echo "$frontend" | jq -r '.path')
              FNAME=$(echo "$frontend" | jq -r '.name // "default"')
              FPREFIX=$(echo "$FNAME" | tr '[:lower:]' '[:upper:]')

              echo "→ Generating $FPATH/.env.local (name: $FNAME)..."

              # Common ENV_* vars (excluding any per-frontend prefixed vars)
              {
                extract_common_env_vars "$VARS_CONTEXT"
                extract_common_env_vars "$SECRETS_CONTEXT"
              } > "$FPATH/.env.local"

              # Per-frontend prefixed vars override common ones
              if [ "$FPREFIX" != "DEFAULT" ]; then
                FULL_PREFIX="ENV_${FPREFIX}_"
                {
                  echo "$VARS_CONTEXT" | jq -r --arg pfx "$FULL_PREFIX" '
                    to_entries[]
                    | select(.key | startswith($pfx))
                    | "\(.key | sub("^" + $pfx; ""))=\(.value)"
                  '
                  echo "$SECRETS_CONTEXT" | jq -r --arg pfx "$FULL_PREFIX" '
                    to_entries[]
                    | select(.key | startswith($pfx))
                    | "\(.key | sub("^" + $pfx; ""))=\(.value)"
                  '
                } >> "$FPATH/.env.local"

                # Deduplicate: keep last occurrence so prefixed vars truly override common ones
                tac "$FPATH/.env.local" | awk -F= '!seen[$1]++' | tac > "$FPATH/.env.local.tmp"
                mv "$FPATH/.env.local.tmp" "$FPATH/.env.local"
              fi

              VAR_COUNT=$(wc -l < "$FPATH/.env.local" | tr -d ' ')
              echo "✓ Generated $FPATH/.env.local with $VAR_COUNT variables"
            done < <(jq -c '.[]' /tmp/frontends.json)
          fi

      - name: Setup Node.js
        if: steps.config.outputs.frontends-enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ steps.config.outputs.cache-dependency-paths }}

      - name: Install and build frontends
        if: steps.config.outputs.frontends-enabled == 'true'
        run: |
          # Use for loop instead of while-read to avoid stdin consumption by npm ci
          FRONTEND_COUNT=$(jq 'length' /tmp/frontends.json)
          for i in $(seq 0 $((FRONTEND_COUNT - 1))); do
            frontend=$(jq -c ".[$i]" /tmp/frontends.json)
            FPATH=$(echo "$frontend" | jq -r '.path')
            FNAME=$(echo "$frontend" | jq -r '.name // "default"')
            BUILD_CMD=$(echo "$frontend" | jq -r '.["build-command"] // "npm run build"')

            echo "================================================"
            echo "→ Building frontend: $FNAME ($FPATH)"
            echo "================================================"

            # Validate frontend path exists
            if [ ! -d "$FPATH" ]; then
              echo "::error::Frontend path '$FPATH' does not exist for frontend '$FNAME'"
              exit 1
            fi

            # Install and build in a subshell for directory isolation
            (
              cd "$FPATH"

              echo "→ Installing dependencies..."
              npm ci

              echo "→ Running: $BUILD_CMD"
              bash -c "$BUILD_CMD"
            )

            # Run post-build commands if defined
            while IFS= read -r cmd; do
              if [ -n "$cmd" ]; then
                echo "  → $cmd"
                (cd "$FPATH" && bash -c "$cmd")
              fi
            done < <(echo "$frontend" | jq -r '.["post-build-commands"] // [] | .[]')

            echo "✓ Frontend $FNAME built successfully"
          done

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-config
          path: ./deploy-artifacts
        continue-on-error: true

      - name: Move JWT keys from artifacts
        run: |
          echo "→ Looking for JWT keys in artifacts..."

          if [ -d "./deploy-artifacts" ]; then
            if [ -d "./deploy-artifacts/backend/config/jwt" ]; then
              mkdir -p ${{ steps.config.outputs.backend-path }}/config/jwt
              cp ./deploy-artifacts/backend/config/jwt/*.pem ${{ steps.config.outputs.backend-path }}/config/jwt/ 2>/dev/null || true
              echo "✓ Copied JWT keys from backend/config/jwt/"
            elif [ -d "./deploy-artifacts/config/jwt" ]; then
              mkdir -p ${{ steps.config.outputs.backend-path }}/config/jwt
              cp ./deploy-artifacts/config/jwt/*.pem ${{ steps.config.outputs.backend-path }}/config/jwt/ 2>/dev/null || true
              echo "✓ Copied JWT keys from config/jwt/"
            elif ls ./deploy-artifacts/*.pem 1>/dev/null 2>&1; then
              # Keys uploaded directly (artifact path ends with /)
              mkdir -p ${{ steps.config.outputs.backend-path }}/config/jwt
              cp ./deploy-artifacts/*.pem ${{ steps.config.outputs.backend-path }}/config/jwt/ 2>/dev/null || true
              echo "✓ Copied JWT keys from artifact root"
            else
              echo "⚠ No JWT keys found in artifacts (this may be expected)"
            fi
          else
            echo "⚠ No deploy-artifacts directory found (this may be expected if no JWT keys are used)"
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Create backup
        if: steps.config.outputs.backup-enabled == 'true'
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          BACKUP_DATABASE: ${{ steps.config.outputs.backup-database }}
        run: |
          echo "→ Creating backup..."
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST "bash -s" << 'EOF'
            set -e

            BACKUP_DIR="$REMOTE_PATH/../backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_NAME="backup_${TIMESTAMP}"

            mkdir -p "$BACKUP_DIR"

            # Save current commit
            cd $REMOTE_PATH
            if [ -d ".git" ]; then
              git rev-parse --short HEAD > "$BACKUP_DIR/${BACKUP_NAME}_commit.txt" 2>/dev/null || echo "unknown" > "$BACKUP_DIR/${BACKUP_NAME}_commit.txt"
            fi

            # Backup database if enabled
            if [ "$BACKUP_DATABASE" == "true" ] && [ -f "$REMOTE_PATH/backend/.env.local" ]; then
              cd $REMOTE_PATH/backend
              source .env.local 2>/dev/null || true

              if [ -n "$DATABASE_URL" ]; then
                DB_USER=$(echo $DATABASE_URL | sed -n 's/.*:\/\/\([^:]*\):.*/\1/p')
                DB_PASS=$(echo $DATABASE_URL | sed -n 's/.*:\/\/[^:]*:\([^@]*\)@.*/\1/p')
                DB_HOST=$(echo $DATABASE_URL | sed -n 's/.*@\([^:\/]*\).*/\1/p')
                DB_NAME=$(echo $DATABASE_URL | sed -n 's/.*\/\([^?]*\).*/\1/p')

                if [ -n "$DB_NAME" ]; then
                  mysqldump -u"$DB_USER" -p"$DB_PASS" -h"$DB_HOST" "$DB_NAME" > "$BACKUP_DIR/${BACKUP_NAME}_database.sql" 2>/dev/null || echo "DB backup warning"
                  echo "✓ Database backup created"
                fi
              fi
            fi

            echo "✓ Backup created: $BACKUP_NAME"
          EOF

      - name: Deploy frontends
        if: steps.config.outputs.frontends-enabled == 'true'
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
        run: |
          FRONTEND_COUNT=$(jq 'length' /tmp/frontends.json)
          for i in $(seq 0 $((FRONTEND_COUNT - 1))); do
            frontend=$(jq -c ".[$i]" /tmp/frontends.json)
            FPATH=$(echo "$frontend" | jq -r '.path')
            FNAME=$(echo "$frontend" | jq -r '.name // "default"')
            DEPLOY_TO=$(echo "$frontend" | jq -r '.["deploy-to"] // "backend/public/"')

            echo "→ Deploying frontend: $FNAME → $DEPLOY_TO"

            # Build rsync exclude arguments
            FRONTEND_EXCLUDE_ARGS=()
            while IFS= read -r exclude; do
              if [ -n "$exclude" ]; then
                FRONTEND_EXCLUDE_ARGS+=("--exclude=$exclude")
              fi
            done < <(echo "$frontend" | jq -r '.["rsync-exclude"] // [] | .[]')

            rsync -avz --delete --mkpath \
              -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
              "${FRONTEND_EXCLUDE_ARGS[@]}" \
              "$FPATH/dist/" \
              "$SSH_USER@$SSH_HOST:$REMOTE_PATH/$DEPLOY_TO"

            echo "✓ Frontend $FNAME deployed"
          done

      - name: Deploy backend
        if: steps.config.outputs.backend-enabled == 'true'
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          BACKEND_PATH: ${{ steps.config.outputs.backend-path }}
        run: |
          # Build rsync exclude arguments safely using array
          EXCLUDE_ARGS=()
          while IFS= read -r exclude; do
            if [ -n "$exclude" ]; then
              EXCLUDE_ARGS+=("--exclude=$exclude")
            fi
          done < /tmp/rsync-excludes.txt

          # Deploy backend code (using array expansion for safety)
          rsync -avz --delete --mkpath \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            "${EXCLUDE_ARGS[@]}" \
            "$BACKEND_PATH/" \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH/backend/"

          # Deploy public/ includes from config (default: index.php)
          while IFS= read -r item; do
            if [ -n "$item" ]; then
              if [ -f "$BACKEND_PATH/public/$item" ]; then
                echo "→ Deploying public/$item"
                rsync -avz \
                  -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
                  "$BACKEND_PATH/public/$item" \
                  "$SSH_USER@$SSH_HOST:$REMOTE_PATH/backend/public/$item"
              elif [ -d "$BACKEND_PATH/public/$item" ]; then
                echo "→ Deploying public/$item/"
                rsync -avz \
                  -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
                  "$BACKEND_PATH/public/$item/" \
                  "$SSH_USER@$SSH_HOST:$REMOTE_PATH/backend/public/$item/"
              fi
            fi
          done < /tmp/public-includes.txt

          # Deploy .env.local if exists
          if [ -f "$BACKEND_PATH/.env.local" ]; then
            echo "→ Deploying .env.local..."
            rsync -avz \
              -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
              "$BACKEND_PATH/.env.local" \
              "$SSH_USER@$SSH_HOST:$REMOTE_PATH/backend/.env.local"
            echo "✓ .env.local deployed"
          else
            echo "⚠ No .env.local found at $BACKEND_PATH/.env.local"
          fi

          # Deploy JWT keys if exist
          if [ -d "$BACKEND_PATH/config/jwt" ]; then
            ssh -i ~/.ssh/deploy_key -p $SSH_PORT "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_PATH/backend/config/jwt"
            rsync -avz \
              -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
              "$BACKEND_PATH/config/jwt/" \
              "$SSH_USER@$SSH_HOST:$REMOTE_PATH/backend/config/jwt/"
            ssh -i ~/.ssh/deploy_key -p $SSH_PORT "$SSH_USER@$SSH_HOST" "chmod 600 $REMOTE_PATH/backend/config/jwt/*.pem 2>/dev/null || true"
          fi

          echo "✓ Backend deployed"

      - name: Run post-deploy tasks
        # All post-deploy tasks run inside the backend directory — nothing to
        # do for static-only deployments (e.g. the public web), and the
        # `cd $REMOTE_PATH/backend` would fail there.
        if: steps.config.outputs.backend-enabled == 'true'
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          DO_COMPOSER: ${{ steps.config.outputs.postdeploy-composer }}
          DO_MIGRATIONS: ${{ steps.config.outputs.postdeploy-migrations }}
          DO_CACHE: ${{ steps.config.outputs.postdeploy-cache }}
          DO_WORKERS: ${{ steps.config.outputs.postdeploy-workers }}
        run: |
          # Copy custom commands to remote
          CUSTOM_COMMANDS=$(cat /tmp/custom-commands.txt | tr '\n' ';')

          ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST "bash -s" << EOF
            set -e

            cd $REMOTE_PATH/backend

            if [ "$DO_COMPOSER" == "true" ]; then
              echo "→ Installing dependencies..."
              composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            fi

            if [ "$DO_MIGRATIONS" == "true" ]; then
              echo "→ Running migrations..."
              APP_ENV=prod php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            fi

            if [ "$DO_CACHE" == "true" ]; then
              echo "→ Clearing cache..."
              APP_ENV=prod php bin/console cache:clear --no-debug
              APP_ENV=prod php bin/console cache:warmup --no-debug
            fi

            echo "→ Fixing permissions..."
            chmod -R 775 var/cache var/log 2>/dev/null || true

            if [ "$DO_WORKERS" == "true" ]; then
              echo "→ Restarting workers..."
              supervisorctl restart messenger-consume:* 2>/dev/null || echo "Supervisor not available"
            fi

            # Run custom commands
            if [ -n "$CUSTOM_COMMANDS" ]; then
              echo "→ Running custom commands..."
              IFS=';' read -ra CMDS <<< "$CUSTOM_COMMANDS"
              for cmd in "\${CMDS[@]}"; do
                if [ -n "\$cmd" ]; then
                  echo "  → \$cmd"
                  eval "\$cmd"
                fi
              done
            fi

            echo "✓ Post-deploy tasks completed"
          EOF

      - name: Health check
        if: steps.config.outputs.healthcheck-enabled == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          HEALTH_URL: ${{ steps.config.outputs.healthcheck-url }}
          VERIFY_PRODUCTION: ${{ steps.config.outputs.healthcheck-verify-production }}
        run: |
          FULL_URL="${APP_URL}${HEALTH_URL}"
          echo "→ Checking $FULL_URL..."

          MAX_RETRIES=5
          RETRY_DELAY=5
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /tmp/health_response.txt -w "%{http_code}" \
              -H "Accept: application/json" "$FULL_URL")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ API is healthy (HTTP $HTTP_CODE)"
              SUCCESS=true
              break
            fi

            if [ $i -lt $MAX_RETRIES ]; then
              echo "⚠ Attempt $i/$MAX_RETRIES failed (HTTP $HTTP_CODE), retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "✗ Health check failed after $MAX_RETRIES attempts (HTTP $HTTP_CODE)"
            cat /tmp/health_response.txt
            exit 1
          fi

          # Verify production mode if enabled
          if [ "$VERIFY_PRODUCTION" == "true" ]; then
            RESPONSE=$(cat /tmp/health_response.txt)
            TESTING_MODE=$(echo "$RESPONSE" | grep -o '"testing_mode":[^,}]*' | cut -d':' -f2 | tr -d ' ')

            if [ "$TESTING_MODE" = "false" ]; then
              echo "✓ Production mode confirmed (testing_mode: false)"
            else
              echo "✗ WARNING: testing_mode is not false!"
              exit 1
            fi
          fi

          # Check frontend
          echo "→ Checking frontend at $APP_URL/..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Frontend is accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠ Frontend returned HTTP $HTTP_CODE"
          fi

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "================================================"
            echo "✓ DEPLOYMENT SUCCESSFUL"
            echo "================================================"
            echo "Environment: ${{ inputs.environment }}"
            echo "URL: ${{ vars.APP_URL }}"
          else
            echo "✗ DEPLOYMENT FAILED"
            echo "Environment: ${{ inputs.environment }}"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f /tmp/rsync-excludes.txt /tmp/public-includes.txt /tmp/frontends.json /tmp/cache-paths.txt /tmp/frontend-prefixes.txt /tmp/custom-commands.txt /tmp/health_response.txt
